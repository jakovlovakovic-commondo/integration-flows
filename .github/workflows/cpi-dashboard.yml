name: CPI - Dashboard (drift check)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # every day at 06:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cpi-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CPI_API_URL: ${{ secrets.CPI_API_URL }}
      CPI_USER: ${{ secrets.CPI_USER }}
      CPI_PASSWORD: ${{ secrets.CPI_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check drift (git vs CPI)
        run: python3 scripts/check_drift.py

      - name: Generate dashboard HTML
        run: python3 scripts/generate_dashboard.py

      - name: Commit dashboard
        run: |
          git config user.name "cpi-bot"
          git config user.email "cpi-bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "docs(cpi): update dashboard [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
